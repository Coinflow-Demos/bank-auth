name: BankAuthDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "NKVT43D4DD" # If you fork this, replace with YOUR OWN team ID
    # (Xcode > Settings > Accounts, or Signing & Capabilities > Team) - this one is
    # tied to a specific personal Apple ID and won't work for anyone else.
targets:
  BankAuthDemo:
    type: application
    platform: iOS
    sources:
      - path: BankAuthDemo
    info:
      path: BankAuthDemo/Info.plist
      properties:
        CFBundleDisplayName: Bank Auth Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # Dev-only: lets us hit http://localhost or a LAN IP. Tighten before shipping.
        # Required on iOS 14+ for any connection to a private/LAN IP address
        # (e.g. if you point apiBaseURL at a machine's 192.168.x.x while
        # developing) - without this, iOS silently blocks the connection
        # instead of prompting, which looks exactly like "no internet
        # connection" to the app.
        NSLocalNetworkUsageDescription: >-
          This test app connects to a local development server on your
          network while testing bank-auth locally.
        CFBundleURLTypes:
          - CFBundleURLName: cash.coinflow.bankauthdemo
            CFBundleURLSchemes:
              - bankauthdemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bankauthdemo
        INFOPLIST_KEY_UILaunchScreen_Generation: true
